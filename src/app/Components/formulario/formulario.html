<section>
    <h1>contacto</h1>
    <form>
        <label for="nombre">Nombre:</label>
        
        <input type="text" [(ngModel)]="nombre"  >
        <button type="submit" (click)="enviarFormulario()">Enviar</button>

    </form>
</section>

<aside>
    <h3>vista previa</h3>
    @if (nombre) {
        <p>Nombre: {{ nombre }}</p>
    }
    @else {
        <p>No se ha ingresado un nombre.</p>
    }
    @if (enviado) {
        <p>Formulario enviado con éxito.</p>
    }
</aside>
