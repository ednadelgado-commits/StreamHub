<header class="sticky top-0 z-50 bg-[#0b0d18]/95
               backdrop-blur-2xl border-b border-violet-400/15
               shadow-[0_10px_40px_rgba(0,0,0,0.55)]
               font-display">

  <nav class="max-w-[1600px] mx-auto px-6 py-4
              flex items-center justify-between gap-6">

    <!-- MARCA -->
    <a routerLink="/" class="flex items-center gap-3 shrink-0 group">

      <div class="w-12 h-12 rounded-2xl
                  bg-gradient-to-br from-violet-500 to-blue-500
                  flex items-center justify-center
                  shadow-[0_0_25px_rgba(124,92,255,0.35)]
                  group-hover:shadow-[0_0_35px_rgba(124,92,255,0.65)]
                  transition-all duration-300">

        <span class="text-2xl font-extrabold text-white">S</span>
      </div>

      <div>
        <h1 class="text-2xl font-extrabold tracking-tight text-white">
          Stream<span class="text-transparent bg-clip-text
                             bg-gradient-to-r from-violet-400 to-blue-400">
            Hub
          </span>
        </h1>

        <p class="text-[9px] font-semibold tracking-[0.22em]
                  text-slate-400">
          STREAMING PLATFORM
        </p>
      </div>

    </a>

    <!-- MENÚ -->
    <div class="flex items-center gap-1.5">

      <a routerLink="/" [routerLinkActiveOptions]="{exact: true}"
        routerLinkActive="!bg-gradient-to-r !from-violet-600/30 !to-blue-600/20 !text-white !border-violet-400/40"
        class="flex items-center gap-2 px-4 py-3 rounded-xl
               border border-transparent text-slate-300
               text-sm font-semibold transition-all duration-300
               hover:bg-white/[0.07] hover:text-white
               hover:border-violet-400/30">
        Catálogo
      </a>

      <a routerLink="/grupos"
        routerLinkActive="!bg-gradient-to-r !from-violet-600/30 !to-blue-600/20 !text-white !border-violet-400/40"
        class="flex items-center gap-2 px-4 py-3 rounded-xl
               border border-transparent text-slate-300
               text-sm font-semibold transition-all duration-300
               hover:bg-white/[0.07] hover:text-white
               hover:border-violet-400/30">
        Grupos
      </a>

      <a routerLink="/solicitudes"
        routerLinkActive="!bg-gradient-to-r !from-violet-600/30 !to-blue-600/20 !text-white !border-violet-400/40"
        class="flex items-center gap-2 px-4 py-3 rounded-xl
               border border-transparent text-slate-300
               text-sm font-semibold transition-all duration-300
               hover:bg-white/[0.07] hover:text-white
               hover:border-violet-400/30">
        Solicitudes
      </a>

      <a routerLink="/finanzas"
        routerLinkActive="!bg-gradient-to-r !from-violet-600/30 !to-blue-600/20 !text-white !border-violet-400/40"
        class="flex items-center gap-2 px-4 py-3 rounded-xl
               border border-transparent text-slate-300
               text-sm font-semibold transition-all duration-300
               hover:bg-white/[0.07] hover:text-white
               hover:border-violet-400/30">
        Finanzas
      </a>

      <a routerLink="/perfil"
        routerLinkActive="!bg-gradient-to-r !from-violet-600/30 !to-blue-600/20 !text-white !border-violet-400/40"
        class="flex items-center gap-2 px-4 py-3 rounded-xl
               border border-transparent text-slate-300
               text-sm font-semibold transition-all duration-300
               hover:bg-white/[0.07] hover:text-white
               hover:border-violet-400/30">
        Mi perfil
      </a>

      <a routerLink="/administrador"
        routerLinkActive="!bg-gradient-to-r !from-violet-600/30 !to-blue-600/20 !text-white !border-violet-400/40"
        class="flex items-center gap-2 px-4 py-3 rounded-xl
               border border-transparent text-slate-300
               text-sm font-semibold transition-all duration-300
               hover:bg-white/[0.07] hover:text-white
               hover:border-violet-400/30">
        Admin
      </a>

    </div>

    <!-- INICIAR SESIÓN -->
    <div class="flex items-center gap-3">

      <a routerLink="/inicio-sesion" routerLinkActive="!from-violet-500 !to-blue-500" class="px-5 py-3 rounded-xl text-sm font-bold text-white
               bg-gradient-to-r from-violet-600 to-blue-600
               hover:from-violet-500 hover:to-blue-500
               shadow-[0_0_20px_rgba(124,92,255,0.25)]
               transition-all duration-300">
        Iniciar sesión
      </a>

    </div>

  </nav>
</header>
